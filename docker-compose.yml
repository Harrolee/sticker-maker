services:
  # PostgreSQL database service
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Migration service
  migration:
    build: .
    command: alembic upgrade head
    working_dir: /app/fastapp/db
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres

  # FastHTML web app
  web:
    build: .
    ports:
      - "5001:5001"
    volumes:
      - .:/code
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      IS_LOCAL: "true"
      DOCKER_ENV: "true"
      ADMIN_USERS: "${ADMIN_USERS:-admin}"
      REPLICATE_API_TOKEN: "${REPLICATE_API_TOKEN:-}"
      REPLICATE_CARTOONIZE_MODEL_HASH: "${REPLICATE_CARTOONIZE_MODEL_HASH:-}"
      REPLICATE_RM_BACKGROUND_MODEL_HASH: "${REPLICATE_RM_BACKGROUND_MODEL_HASH:-}"
      SELL_APP_TOKEN: "${SELL_APP_TOKEN:-}"
      SELL_APP_STOREFRONT_NAME: "${SELL_APP_STOREFRONT_NAME:-}"
    restart: unless-stopped

  # Fake local SMTP server
  maildev:
    image: maildev/maildev
    ports:
      - "1025:1025" # SMTP port
      - "1080:1080" # Web interface port

volumes:
  postgres_data:
